<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 음표 -->
    <symbol id="music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 17.5V5.5l10-2v12"/>
      <circle cx="6.5" cy="17.5" r="2.5"/>
      <circle cx="16.5" cy="15.5" r="2.5"/>
    </symbol>

    <!-- 박자 측정 -->
    <symbol id="pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12h4l3-7.5 5 15 3-7.5h4"/>
    </symbol>

    <!-- 길이 조절 -->
    <symbol id="stretch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 5v14M21 5v14M7 12h10M9.5 9.5 7 12l2.5 2.5M14.5 9.5 17 12l-2.5 2.5"/>
    </symbol>

    <!-- 메트로놈 -->
    <symbol id="metronome" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3.5h6l4 17H5zM6.2 15.5h11.6M12 15.5l6.5-9"/>
    </symbol>

    <!-- 막대 그래프 -->
    <symbol id="chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 20.5h17M6.5 16.5v-5M12 16.5v-9M17.5 16.5v-13"/>
    </symbol>

    <!-- 값 바꾸기 -->
    <symbol id="swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h15M15.5 4.5 19 8l-3.5 3.5M20 16H5M8.5 12.5 5 16l3.5 3.5"/>
    </symbol>

    <!-- 안내 -->
    <symbol id="info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 11v5.5M12 7.5v.1"/>
    </symbol>

    <!-- 주의 -->
    <symbol id="alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 2.5 20.5h19zM12 10v5M12 17.8v.1"/>
    </symbol>

    <!-- 복사 -->
    <symbol id="copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8.5" y="8.5" width="12" height="12" rx="2"/>
      <path d="M5.5 15.5h-2v-12h12v2"/>
    </symbol>

    <!-- 완료 -->
    <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4.5 12.5 5 5 10-11"/>
    </symbol>

    <!-- 재생 -->
    <symbol id="play" viewBox="0 0 24 24">
      <path fill="currentColor" d="M7 4.3v15.4a1 1 0 0 0 1.5.9l12.3-7.7a1 1 0 0 0 0-1.8L8.5 3.4A1 1 0 0 0 7 4.3z"/>
    </symbol>

    <!-- 정지 -->
    <symbol id="stop" viewBox="0 0 24 24">
      <rect fill="currentColor" x="5" y="5" width="14" height="14" rx="1.5"/>
    </symbol>
  </defs>
</svg>
